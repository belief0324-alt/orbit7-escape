<title>ORBIT-7 탈출</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: HUD bar on top → illustrated room scene you click into → hardware-style device panels as overlays. Single dark world (inside a station). */
:root{
  --void:#080b13; --hull:#111725; --panel:#171f31; --panel-2:#1d2740; --line:#2c3854;
  --fg:#e8ecf6; --dim:#8f9ab6;
  --amber:#ffb547; --o2:#6fd6ff; --ok:#5fe0a0; --alert:#ff5d62;
  --c-red:#ff6363; --c-blue:#58aaff; --c-yellow:#ffc842;
  --screen:#04120d; --phosphor:#7dffc0;
  --f-display:"Chakra Petch","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:40}
body.critical #vignette{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 120px 20px rgba(255,40,50,.12)}50%{box-shadow:inset 0 0 200px 70px rgba(255,40,50,.4)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:60;background:var(--alert);opacity:0}
#flash.on{animation:flash .45s}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}

#app{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr}
.hud{background:rgba(8,11,19,.94);border-bottom:1px solid var(--line);padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.hud-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;color:var(--amber);font-size:15px}
.o2{flex:1 1 220px;display:flex;align-items:center;gap:10px;min-width:0}
.o2 span.l{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.o2-bar{flex:1;height:12px;border-radius:2px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;position:relative}
.o2-fill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--o2);transition:width .3s linear}
.o2-bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(8,11,19,.7) 9% 10%)}
.o2-num{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;min-width:48px;text-align:right;color:var(--o2)}
body.critical .o2-fill{background:var(--alert)} body.critical .o2-num{color:var(--alert)}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
.icon-btn{background:none;border:1px solid var(--line);color:var(--dim);font:500 12px var(--f-mono);padding:5px 9px;border-radius:3px;cursor:pointer}
.icon-btn:hover{color:var(--fg)}
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.trk{border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(23,31,49,.6)}
.trk.on{border-color:var(--amber);color:var(--amber)} .trk.done{border-color:rgba(95,224,160,.5);color:var(--ok)}

main{overflow-y:auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
.console{max-width:760px;width:100%;margin:0 auto;background:rgba(23,31,49,.94);border:1px solid var(--line);border-radius:4px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.console::before,.console::after{content:"";position:absolute;width:26px;height:26px}
.console::before{left:-1px;top:-1px;border-left:2px solid var(--amber);border-top:2px solid var(--amber)}
.console::after{right:-1px;bottom:-1px;border-right:2px solid var(--amber);border-bottom:2px solid var(--amber)}
.c-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 20px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--dim)}
.c-head b{color:var(--amber);font-weight:600}
.c-body{padding:22px 20px 24px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(40px,9vw,72px);letter-spacing:.06em} h1 span{color:var(--amber)}
h2{font-size:clamp(22px,4.5vw,30px)} h3{font-size:18px;letter-spacing:.03em}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;color:var(--amber);text-transform:uppercase}
p{margin:0}
.story{color:#cbd3e8;max-width:62ch;white-space:pre-line}
.aria{border-left:2px solid var(--o2);padding:9px 14px;background:rgba(111,214,255,.07);font-size:15px}
.aria b{font-family:var(--f-mono);color:var(--o2);font-size:12px;letter-spacing:.12em;display:block}
.small{font-size:13px;color:var(--dim)}
.btn{font:600 16px var(--f-display);letter-spacing:.06em;background:var(--amber);color:#1b1404;border:0;border-radius:3px;padding:11px 20px;cursor:pointer;justify-self:start}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:2px solid var(--o2);outline-offset:2px}
.speed{display:flex;gap:6px;flex-wrap:wrap}
.speed button{font:500 14px var(--f-body);background:var(--panel-2);color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:7px 12px;cursor:pointer}
.speed button[aria-pressed="true"]{border-color:var(--o2);color:var(--o2)}

/* ---------- room scene ---------- */
.scene-box{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.scene{display:block;width:100%;height:auto}
.hs{cursor:pointer}
.hs .art{transition:filter .2s}
.hs:hover .art,.hs:focus-visible .art{filter:drop-shadow(0 0 10px rgba(255,200,120,.7)) brightness(1.15)}
.hs:focus{outline:none}
.ping{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:8 6;opacity:.55;animation:ping 2.2s ease-in-out infinite}
@keyframes ping{50%{opacity:.12}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.spark{animation:blink .35s steps(2) infinite}
.door-l,.door-r{transition:transform 1s cubic-bezier(.7,0,.3,1)}
.open .door-l{transform:translateX(-66px)} .open .door-r{transform:translateX(66px)}
.aria-bar{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:rgba(17,23,37,.92);border-radius:4px;padding:10px 14px;font-size:15px}
.aria-bar .eye{flex:none;width:14px;height:14px;border-radius:50%;background:var(--o2);box-shadow:0 0 12px var(--o2);margin-top:5px}
.spots{display:flex;flex-wrap:wrap;gap:8px}
.spot{display:flex;align-items:center;gap:8px;font:500 14px var(--f-body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:8px 12px;cursor:pointer}
.spot:hover{border-color:var(--amber)}
.spot .st{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.spot.done{border-color:rgba(95,224,160,.45)} .spot.done .st{color:var(--ok)}
.shape{display:inline-block;vertical-align:-2px}

/* ---------- device modal (hardware) ---------- */
#modal{position:fixed;inset:0;z-index:30;background:rgba(3,5,10,.72);backdrop-filter:blur(3px);display:grid;place-items:center;
  padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.dev{width:min(760px,100%);border-radius:10px;padding:14px;position:relative;
  background:linear-gradient(160deg,#4a5368,#2a3142 40%,#1f2533 60%,#3a4255);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.4)}
.dev.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9cfdb,#5b6274);box-shadow:0 1px 1px rgba(0,0,0,.5)}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:4px;height:2px;background:#3a4050;transform:rotate(35deg)}
.screw.a{left:7px;top:7px}.screw.b{right:7px;top:7px}.screw.c{left:7px;bottom:7px}.screw.d{right:7px;bottom:7px}
.dev-top{display:flex;align-items:center;gap:10px;padding:4px 12px 12px;font-family:var(--f-mono);font-size:12px;color:#c9d0de;letter-spacing:.1em}
.dev-top .t{flex:1;min-width:0}
.dev-top .t b{display:block;font-family:var(--f-display);font-size:18px;letter-spacing:.04em;color:#fff}
.close{background:#1a1f2b;color:#d8deea;border:1px solid #5a6276;border-radius:3px;font:500 13px var(--f-body);padding:6px 12px;cursor:pointer}
.glass{background:var(--screen);border-radius:6px;border:2px solid #0d1117;box-shadow:inset 0 0 40px rgba(0,0,0,.8),inset 0 0 0 1px rgba(125,255,192,.08);padding:18px 16px;position:relative;display:grid;gap:14px;overflow:hidden}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.glass .prompt{color:var(--phosphor);font-size:15px}
.en{font-family:var(--f-mono);font-size:clamp(15px,3.2vw,18px);line-height:1.55;color:var(--fg)}
.ko{font-size:16px;font-weight:500}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--amber);text-align:center;color:var(--amber)}
.clue{border:1px dashed rgba(125,255,192,.3);border-radius:4px;padding:10px 12px;display:grid;gap:6px;font-size:15px}
table.data{border-collapse:collapse;font-family:var(--f-mono);font-size:14px}
table.data th,table.data td{border:1px solid rgba(125,255,192,.25);padding:6px 12px;text-align:center}
table.data th{color:var(--phosphor);font-weight:400}
.msg{font-family:var(--f-mono);font-size:14px;color:var(--alert);min-height:1.3em}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 6px 2px}
.hint-btn{font:500 14px var(--f-body);background:#12233a;color:var(--o2);border:1px solid rgba(111,214,255,.45);border-radius:3px;padding:7px 12px;cursor:pointer}
.hint-btn:disabled{opacity:.4;cursor:default}
.hint-box{font-size:14px;color:var(--o2);flex:1 1 220px}

.opts{display:grid;gap:8px}
.opt,.line-btn{display:flex;gap:12px;align-items:flex-start;text-align:left;font:500 15px var(--f-mono);background:rgba(125,255,192,.04);color:var(--fg);border:1px solid rgba(125,255,192,.22);border-radius:3px;padding:10px 12px;cursor:pointer;width:100%}
.opt .k,.line-btn .k{color:var(--phosphor);flex:none}
.opt:hover:not(:disabled),.line-btn:hover{border-color:var(--phosphor)}
.opt:disabled{opacity:.3;text-decoration:line-through;cursor:default}
.line-btn[aria-pressed="true"]{border-color:var(--amber);background:rgba(255,181,71,.12)}
.line-btn[aria-pressed="true"] .k{color:var(--amber)}

.order-line{min-height:54px;border:1px dashed var(--amber);border-radius:3px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.order-line:empty::before{content:"단어 조각을 순서대로 누르세요";color:var(--dim);font-size:14px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 15px var(--f-mono);background:#0d1d17;color:var(--fg);border:1px solid rgba(125,255,192,.3);border-radius:3px;padding:7px 11px;cursor:pointer}
.order-line .chip{border-color:var(--amber)}

.wires{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media (max-width:560px){.wires{grid-template-columns:1fr}}
.wcol{display:grid;gap:8px;align-content:start}
.wl,.wr{display:flex;gap:10px;align-items:center;text-align:left;font:500 15px var(--f-mono);background:rgba(125,255,192,.04);color:var(--fg);border:1px solid rgba(125,255,192,.22);border-radius:3px;padding:9px 10px;cursor:pointer;width:100%}
.wl small{display:block;font-family:var(--f-body);color:var(--dim);font-size:13px}
.wl[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.plug{flex:none;width:14px;height:14px;border-radius:3px;border:2px solid currentColor}
.plug.fill{background:currentColor}
.wr .plugs{display:flex;gap:4px;margin-left:auto}

.wheels{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:6px 0}
.wheel{display:grid;gap:4px;justify-items:center}
.wheel button{width:46px;height:30px;background:#1b2231;color:#cfd6e4;border:1px solid #47506a;border-radius:3px;cursor:pointer;font-size:14px}
.wheel .ch{width:46px;height:58px;display:grid;place-items:center;font:600 30px var(--f-mono);color:var(--amber);border-radius:4px;
  background:linear-gradient(180deg,#0a0d14,#2a3142 22%,#3a4256 50%,#2a3142 78%,#0a0d14);border:1px solid #59627a;text-shadow:0 0 8px rgba(255,181,71,.5)}
.wheels .dot{font:600 30px var(--f-mono);color:var(--amber)} .wheels .unit{font:500 15px var(--f-mono);color:var(--dim);margin-left:4px}

.tokens{display:flex;flex-wrap:wrap;gap:4px}
.tok{font:500 17px var(--f-mono);background:none;color:var(--fg);border:1px solid transparent;border-bottom:1px dashed rgba(125,255,192,.3);border-radius:2px;padding:3px 6px;cursor:pointer}
.tok:hover{border-color:var(--dim)}
.tok[aria-pressed="true"]{border-color:var(--alert);color:var(--alert);background:rgba(255,93,98,.12)}
.tok.fixed{color:var(--ok);border-color:transparent}

.cls{display:grid;gap:8px}
.cls-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid rgba(125,255,192,.12);padding-bottom:8px}
@media (max-width:560px){.cls-row{grid-template-columns:1fr}}
.cls-row .en{font-size:15px}
.cls-row mark{background:none;color:var(--amber);font-weight:600;text-decoration:underline}
.seg{display:flex;gap:4px}
.seg button{font:500 13px var(--f-body);background:#0d1d17;color:var(--dim);border:1px solid rgba(125,255,192,.25);border-radius:3px;padding:5px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{color:#08130e;background:var(--phosphor);border-color:var(--phosphor)}

.solved{border:1px solid var(--ok);background:rgba(95,224,160,.08);border-radius:4px;padding:12px 14px;display:grid;gap:8px}
.solved .t{font-family:var(--f-mono);color:var(--ok);font-weight:600;letter-spacing:.1em}
.big-digit{display:flex;align-items:center;gap:12px;font:600 44px var(--f-mono)}
.manual{display:grid;gap:12px;color:#d7dded}
.manual .sec{display:grid;gap:4px}
.manual .sec b{color:var(--phosphor);font-family:var(--f-mono);font-size:13px;letter-spacing:.08em}
.manual code{font-family:var(--f-mono);color:var(--amber)}
.manual .ex{font-family:var(--f-mono);font-size:14px;color:#aeb8cf}

.keypad-wrap{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,240px);align-items:start}
@media (max-width:560px){.keypad-wrap{grid-template-columns:1fr}}
.slots{display:flex;gap:8px}
.slot{width:52px;height:62px;border:1px solid #47506a;border-radius:3px;display:grid;place-items:center;font:600 30px var(--f-mono);color:var(--amber);background:#05070c}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{font:600 20px var(--f-mono);background:linear-gradient(180deg,#3a4256,#252b3a);color:#e6eaf3;border:1px solid #59627a;border-radius:4px;padding:11px 0;cursor:pointer;box-shadow:0 2px 0 #10131b}
.keys button:active{transform:translateY(2px);box-shadow:none}
.keys .go{background:linear-gradient(180deg,#ffc56b,#e59a2a);color:#1b1404;border-color:#ffb547}
.order-sym{display:flex;gap:14px;align-items:center;font-family:var(--f-mono)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.stat .v{font:600 22px var(--f-mono);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--dim)}
.grade{font:700 88px/1 var(--f-display);color:var(--amber)}
.review{display:grid;gap:10px}
.rv{border-left:2px solid var(--alert);padding:6px 12px;font-size:15px;display:grid;gap:2px}
.rv .m{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.rv .a{font-family:var(--f-mono);color:var(--ok)}
.pod{width:80px;height:120px;margin:0 auto}
.pod.launch{animation:launch 2.4s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes launch{15%{transform:translateY(6px)}100%{transform:translateY(-140vh)}}
.unlock{animation:unlock .9s ease-out}
@keyframes unlock{0%{opacity:0;transform:scale(.6);filter:blur(6px)}60%{opacity:1;transform:scale(1.08)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<div id="app">
  <header class="hud" id="hud" hidden>
    <div class="hud-row">
      <div class="brand">ORBIT-7</div>
      <div class="o2"><span class="l">O₂</span><div class="o2-bar" id="o2bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-label="남은 산소"><div class="o2-fill" id="o2fill"></div></div><div class="o2-num" id="o2num">100%</div></div>
      <div class="clock" id="clock">00:00</div>
      <button class="icon-btn" id="soundBtn" type="button">소리 켜짐</button>
    </div>
    <div class="track" id="track"></div>
  </header>
  <main><div class="wrap" id="view"></div></main>
</div>
<div id="modal" hidden></div>

<script>
/* =====================================================================
   방·장치 데이터 (선생님이 고칠 수 있는 부분)
   kind: multi(여러 줄 고르기) / wires(배선 연결) / wheel(다이얼 자물쇠) / order(단어 배열)
         choice(객관식, 보기는 매번 섞임) / fix(틀린 단어 누르고 고치기) / classify(분류) / tapmulti(틀린 단어 모두 찾기)
   color: red ▲ / blue ● / yellow ■ — 해결하면 그 색 램프에 digit이 켜짐
   ===================================================================== */
const ROOMS = [
{ id:"life", name:"생명유지실", en:"LIFE SUPPORT", tint:{w1:"#1d2c35",w2:"#111a21",light:"#c6f4ff"},
  story:"수면 캡슐에서 깨어났다. 경고등이 붉게 깜빡이고, 산소 순환 장치는 멈춰 있다.\n다른 승무원들은 보이지 않는다. 생명유지실 문도 잠겨 있다.",
  aria:"저는 정거장 AI ARIA예요. 이 방의 장치 세 개를 고칠 때마다 램프에 숫자가 하나씩 켜져요. 문 위 표시판의 모양 순서대로 숫자를 입력하면 문이 열려요.",
  manual:[
    ["make / let / have + 목적어 + 동사원형","~가 …하게 하다", "The storm made everyone stay home."],

let AC=null, soundOn=true;
function beep(f,d=.12,type="sine",v=.08,w=0){ if(!AC||!soundOn)return; const t=AC.currentTime+w,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}
const sfx={ok(){beep(660,.1,"triangle");beep(990,.16,"triangle",.08,.09);},bad(){beep(140,.28,"sawtooth",.07);beep(105,.3,"sawtooth",.06,.12);},
  unlock(){[523,659,784,1046].forEach((f,i)=>beep(f,.18,"triangle",.07,i*.1));},alarm(){beep(880,.09,"square",.035);beep(880,.09,"square",.035,.16);},
  key(){beep(1250,.035,"square",.025);},door(){beep(90,.8,"sawtooth",.05);beep(60,.9,"sine",.08,.1);}};
$("#soundBtn").onclick=()=>{soundOn=!soundOn;$("#soundBtn").textContent=soundOn?"소리 켜짐":"소리 꺼짐";};

/* ---------- HUD & O2 ---------- */
function renderTrack(){
  $("#track").innerHTML=ROOMS.map((r,i)=>`<div class="trk ${i<S.room||S.escaped?"done":i===S.room?"on":""}">${i<S.room||S.escaped?"✓ ":""}${r.name}</div>`).join("");
}
function updateHud(){
  const v=Math.max(0,S.o2); $("#o2fill").style.width=v+"%"; $("#o2num").textContent=Math.ceil(v)+"%"; $("#o2bar").setAttribute("aria-valuenow",Math.ceil(v));
  const s=Math.floor(S.elapsed); $("#clock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  document.body.classList.toggle("critical",v<25&&!S.over&&S.running);
}
let last=performance.now(), alarmT=0;
setInterval(()=>{ const now=performance.now(),dt=(now-last)/1000; last=now; if(!S.running||S.over)return;
  S.elapsed+=dt; S.o2-=dt/SPEEDS[S.speed].sec; if(S.o2<25){alarmT+=dt;if(alarmT>3){alarmT=0;sfx.alarm();}} updateHud(); if(S.o2<=0)gameOver(); },250);
function drain(n){ S.o2-=n; updateHud(); const f=$("#flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); if(S.o2<=0){gameOver();return true;} return false; }

/* ---------- shapes ---------- */
function shapeSVG(color,size=16,lit=true,digit){
  const c=COLORS[color], fill=lit?c.hex:"none", st=c.hex;
  const s=c.shape==="tri"?`<polygon points="8,1 15,15 1,15" fill="${fill}" stroke="${st}" stroke-width="2"/>`:c.shape==="circle"?`<circle cx="8" cy="8" r="6.5" fill="${fill}" stroke="${st}" stroke-width="2"/>`:`<rect x="1.5" y="1.5" width="13" height="13" fill="${fill}" stroke="${st}" stroke-width="2"/>`;
  return `<svg class="shape" width="${size}" height="${size}" viewBox="0 0 16 16" aria-label="${c.ko}">${s}</svg>`;
}
function shapeIn(color,cx,cy,r,lit){ // inside scene svg
  const c=COLORS[color], fill=lit?c.hex:"#1a1f2a", op=lit?1:.9;
  const g=lit?` filter="url(#glow)"`:"";
  if(c.shape==="tri") return `<polygon points="${cx},${cy-r} ${cx+r},${cy+r*.8} ${cx-r},${cy+r*.8}" fill="${fill}" stroke="${c.hex}" stroke-width="2" opacity="${op}"${g}/>`;
  if(c.shape==="circle") return `<circle cx="${cx}" cy="${cy}" r="${r*.85}" fill="${fill}" stroke="${c.hex}" stroke-width="2" opacity="${op}"${g}/>`;
  return `<rect x="${cx-r*.8}" y="${cy-r*.8}" width="${r*1.6}" height="${r*1.6}" fill="${fill}" stroke="${c.hex}" stroke-width="2" opacity="${op}"${g}/>`;
}

  const manual=`<g class="hs" data-act="manual" tabindex="0" role="button" aria-label="매뉴얼 보기"><g class="art">

   <div class="glass">${inner}<div class="msg" id="msg" role="status"></div></div>

}
let onModalClose=null;
function openModal(html){ modal.innerHTML=html; modal.hidden=false; $("#mclose").onclick=closeModal; modal.onclick=e=>{ if(e.target===modal) closeModal(); };
  document.onkeydown=e=>{ if(e.key==="Escape") closeModal(); }; setTimeout(()=>{ const f=modal.querySelector(".glass button, .glass input"); const t=f||$("#mclose"); if(t) t.focus(); },30); }
function closeModal(){ modal.hidden=true; modal.innerHTML=""; document.onkeydown=null; const cb=onModalClose; onModalClose=null; if(cb) cb(); }
function msg(t){ const m=$("#msg"); if(m) m.textContent=t; }
function shakeDev(){ const d=modal.querySelector(".dev"); if(!d) return; d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); }

function openManual(r){
  openModal(shell("코드 매뉴얼",r.en+" · MANUAL",null,`<div class="manual">${r.manual.map(([h,m,ex])=>`<div class="sec"><b>${esc(h)}</b><span>${esc(m)}</span>${ex?`<span class="ex">${esc(ex)}</span>`:""}</div>`).join("")}</div>`,false));
}

/* ---------- devices ---------- */
function fail(dev,given){
  sfx.bad(); shakeDev();
  if(!S.wrong[dev.id]){ S.wrong[dev.id]=1; S.mistakes.push({room:ROOMS[S.room].name,title:dev.title,given,answer:dev.review,explain:dev.explain}); }
  msg(`접근 거부 · 산소 −${WRONG_COST}%`); drain(WRONG_COST);
}
function solve(dev){
  if(S.solved[dev.id]) return;
  S.solved[dev.id]=1; if(!S.wrong[dev.id]) S.firstTry++; sfx.ok(); setTimeout(sfx.unlock,250);
  const g=modal.querySelector(".glass"); g.querySelectorAll("button,input").forEach(b=>b.disabled=true);
  const hb=$("#hint"); if(hb) hb.disabled=true;
  const box=document.createElement("div"); box.className="solved unlock";
  box.innerHTML=`<span class="t">ACCESS GRANTED</span><div>${dev.explain}</div>
    ${dev.color?`<div class="big-digit">${shapeSVG(dev.color,34,true)}<span style="color:${COLORS[dev.color].hex}">${dev.digit}</span><span class="small" style="font-size:14px">${COLORS[dev.color].ko} 램프에 숫자가 켜졌다</span></div>`:""}
    <div class="btn-row"><button class="btn" id="back" type="button">${dev.kind==="tapmulti"?"해치로 가기":"방으로 돌아가기"}</button></div>`;
  g.appendChild(box); msg("");
  $("#back").disabled=false; $("#back").onclick=closeModal; $("#back").focus();
  onModalClose=()=>{ if(!S.over) roomView(); };
}

function openDevice(dev){
  if(S.over) return;
  const R=RENDER[dev.kind](dev);
  const sub=S.solved[dev.id]?"RESTORED":"MALFUNCTION";
  openModal(shell(dev.title,sub,dev.color,`<p class="prompt">${esc(dev.prompt)}</p>${R.html}`));
  if(S.solved[dev.id]){ modal.querySelector(".glass").querySelectorAll("button,input").forEach(b=>b.disabled=true); $("#hint").disabled=true;
    msg(""); const g=modal.querySelector(".glass"); const box=document.createElement("div"); box.className="solved"; box.innerHTML=`<span class="t">RESTORED</span><div>${dev.explain}</div>`; g.appendChild(box); return; }
  const hb=$("#hint");
  if(S.hinted[dev.id]){ hb.disabled=true; $("#hintbox").textContent=dev.hint; }
  hb.onclick=()=>{ if(S.hinted[dev.id]) return; S.hinted[dev.id]=1; S.hints++; hb.disabled=true; $("#hintbox").textContent=dev.hint; R.onHint&&R.onHint(); drain(HINT_COST); };
  R.bind(modal.querySelector(".glass"));
}

const RENDER={
 multi(dev){
  return { html:`<div class="opts">${dev.lines.map((l,i)=>`<button class="line-btn" type="button" aria-pressed="false" data-i="${i}"><span class="k">${i+1}</span><span>${esc(l[0])}</span></button>`).join("")}</div>
    <div class="btn-row"><button class="btn" id="send" type="button">${dev.mode==="wrong"?"선택한 기록 삭제":"선택한 기록 저장"}</button><span class="small" id="cnt">0개 선택</span></div>`,
   bind(g){ const bs=[...g.querySelectorAll(".line-btn")];
     bs.forEach(b=>b.onclick=()=>{ b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true"); sfx.key(); $("#cnt").textContent=bs.filter(x=>x.getAttribute("aria-pressed")==="true").length+"개 선택"; });
     $("#send").onclick=()=>{ const sel=bs.filter(x=>x.getAttribute("aria-pressed")==="true").map(x=>+x.dataset.i);
       if(!sel.length){ msg("하나 이상 고르세요."); return; }
       const target=dev.lines.map((l,i)=>[l,i]).filter(([l])=>dev.mode==="wrong"?!l[1]:l[1]).map(([,i])=>i);
       if(sel.length===target.length&&target.every(i=>sel.includes(i))) solve(dev); else fail(dev,sel.map(i=>i+1).join("·")+"번"); }; } };
 },
 wires(dev){
  const right=shuffle(dev.right.map((t,i)=>i));
  return { html:`<div class="wires"><div class="wcol">${dev.left.map((l,i)=>`<button class="wl" type="button" data-i="${i}" aria-pressed="false" style="color:${CABLE[i]}"><span class="plug fill"></span><span style="color:var(--fg)">${esc(l[0])} …<small>${esc(l[1])}</small></span></button>`).join("")}</div>
    <div class="wcol">${right.map(j=>`<button class="wr" type="button" data-j="${j}"><span>${esc(dev.right[j])}</span><span class="plugs"></span></button>`).join("")}</div></div>
    <div class="btn-row"><button class="btn" id="send" type="button">전원 연결</button><button class="btn ghost" id="clr" type="button">전선 분리</button></div>`,
   bind(g){ let sel=null; const conn={}; const L=[...g.querySelectorAll(".wl")], Rb=[...g.querySelectorAll(".wr")];
     const draw=()=>{ Rb.forEach(b=>{ const j=+b.dataset.j; b.querySelector(".plugs").innerHTML=Object.entries(conn).filter(([,v])=>v===j).map(([k])=>`<span class="plug fill" style="color:${CABLE[k]}"></span>`).join(""); });
       L.forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.i===sel))); };
     L.forEach(b=>b.onclick=()=>{ sel=+b.dataset.i; sfx.key(); draw(); });
     Rb.forEach(b=>b.onclick=()=>{ const j=+b.dataset.j; if(sel===null){ for(const k in conn) if(conn[k]===j) delete conn[k]; draw(); return; }
       for(const k in conn) if(conn[k]===j) delete conn[k]; conn[sel]=j; sfx.key(); const nxt=L.find(x=>conn[x.dataset.i]===undefined); sel=nxt?+nxt.dataset.i:null; draw(); });
     $("#clr").onclick=()=>{ for(const k in conn) delete conn[k]; sel=0; draw(); };
     $("#send").onclick=()=>{ if(Object.keys(conn).length<dev.left.length){ msg("전선 4개를 모두 연결하세요."); return; }
       const ok=dev.left.every((l,i)=>dev.right[conn[i]]===l[2]);
       if(ok) solve(dev); else fail(dev,dev.left.map((l,i)=>l[0]+" "+dev.right[conn[i]]).join(" / ")); };
     sel=0; draw(); } };
 },
 wheel(dev){
  const n=dev.pattern.replace(/[^#]/g,"").length, cs=dev.charset;
  let pos=Array.from({length:n},()=>Math.floor(Math.random()*cs.length));
  if(dev.answer.includes(pos.map(i=>cs[i]).join(""))) pos[0]=(pos[0]+1)%cs.length;
  let k=0; const parts=dev.pattern.split("").map(ch=>ch==="#"?`<div class="wheel"><button type="button" data-w="${k}" data-d="1" aria-label="${k+1}번째 위로">▲</button><div class="ch" id="w${k}"></div><button type="button" data-w="${k++}" data-d="-1" aria-label="아래로">▼</button></div>`:`<span class="dot">${ch}</span>`).join("");
  return { html:`<div class="clue">${dev.clue}</div><div class="wheels">${parts}${dev.charset.length===10?'<span class="unit">MHz</span>':""}</div>
    <div class="btn-row"><button class="btn" id="send" type="button">${dev.charset.length===10?"주파수 송신":"잠금 해제"}</button></div>`,
   bind(g){ const draw=()=>pos.forEach((p,i)=>$("#w"+i).textContent=cs[p]); draw();
     g.querySelectorAll(".wheel button").forEach(b=>b.onclick=()=>{ const i=+b.dataset.w; pos[i]=(pos[i]+ +b.dataset.d+cs.length)%cs.length; sfx.key(); draw(); });
     $("#send").onclick=()=>{ const v=pos.map(i=>cs[i]).join(""); if(dev.answer.includes(v)) solve(dev); else fail(dev,v); }; } };
 },
 order(dev){
  let ord=shuffle(dev.chips.map((c,i)=>i)); let gd=0; while(ord.slice(0,dev.answer.length).map(i=>dev.chips[i]).join(" ")===dev.answer.join(" ")&&gd++<10) ord=shuffle(ord);
  return { html:`${dev.ko?`<p class="ko">${esc(dev.ko)}</p>`:""}${dev.en?`<p class="en">${esc(dev.en)}</p>`:""}<div class="order-line" id="line"></div><div class="pool" id="pool"></div>
    <div class="btn-row"><button class="btn" id="send" type="button">명령 전송</button><button class="btn ghost" id="rst" type="button">다시 배열</button></div>`,
   bind(g){ const pool=$("#pool"), line=$("#line");
     ord.forEach(i=>{ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=dev.chips[i]; b.onclick=()=>{ sfx.key(); (b.parentElement===pool?line:pool).appendChild(b); }; pool.appendChild(b); });
     $("#rst").onclick=()=>[...line.children].forEach(c=>pool.appendChild(c));
     $("#send").onclick=()=>{ const got=[...line.children].map(c=>c.textContent); if(!got.length){ msg("조각을 먼저 배열하세요."); return; }
       if(got.join(" ")===dev.answer.join(" ")) solve(dev); else fail(dev,got.join(" ")); }; } };
 },
 choice(dev){
  const order=dev.fixed?dev.options.map((o,i)=>i):shuffle(dev.options.map((o,i)=>i));
  return { html:`${dev.table?`<div style="overflow-x:auto"><table class="data">${dev.table.map((r,i)=>`<tr>${r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")}</tr>`).join("")}</table></div>`:""}
    ${dev.clue?`<div class="clue">${dev.clue}</div>`:""}${dev.en?`<p class="en">${esc(dev.en)}</p>`:""}
    <div class="opts">${order.map((i,k)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${"ABCDE"[k]}</span><span>${esc(dev.options[i])}</span></button>`).join("")}</div>`,
   bind(g){ g.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(i===dev.answer) solve(dev); else { b.disabled=true; fail(dev,dev.options[i]); } }); },
   onHint(){ const w=[...modal.querySelectorAll(".opt")].filter(b=>+b.dataset.i!==dev.answer&&!b.disabled); if(w.length>1) shuffle(w)[0].disabled=true; } };
 },
 fix(dev){
  return { html:`<div id="fixarea"></div>`,
   bind(g){ let step=0; const area=$("#fixarea");
     const render=()=>{ const [sent,opts]=dev.items[step]; const toks=sent.split(" ");
       area.innerHTML=`<p class="small">오류 문장 ${step+1} / ${dev.items.length}</p><div class="tokens">${toks.map((t,i)=>`<button class="tok" type="button" data-i="${i}" aria-pressed="false">${esc(t.replace(/^\*/,""))}</button>`).join("")}</div><div id="fixopts"></div>`;
       area.querySelectorAll(".tok").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; area.querySelectorAll(".tok").forEach(x=>x.setAttribute("aria-pressed",x===b));
         if(!toks[i].startsWith("*")){ fail(dev,toks[i]); return; }
         msg(""); sfx.key(); area.querySelectorAll(".tok").forEach(x=>x.disabled=true);
         const ord=shuffle(opts.map((o,k)=>k));
         $("#fixopts").innerHTML=`<p class="prompt" style="margin:8px 0">'${esc(toks[i].replace(/^\*/,""))}'을(를) 무엇으로 고칠까요?</p><div class="opts">${ord.map((k,n)=>`<button class="opt" type="button" data-k="${k}"><span class="k">${"ABCD"[n]}</span><span>${esc(opts[k])}</span></button>`).join("")}</div>`;
         $("#fixopts").querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ const k=+o.dataset.k; if(k!==0){ o.disabled=true; fail(dev,toks[i]+" → "+opts[k]); return; }
           sfx.ok(); step++; if(step>=dev.items.length) solve(dev); else render(); });
       }); };
     render(); } };
 },
 classify(dev){
  return { html:`<div class="cls">${dev.items.map((it,i)=>`<div class="cls-row"><span class="en"><span style="color:var(--phosphor)">${i+1}</span> ${esc(it[0]).replace(/\b(It|it)\b/,"<mark>$1</mark>")}</span>
     <div class="seg" data-i="${i}">${dev.cats.map((c,k)=>`<button type="button" data-k="${k}" aria-pressed="false">${c}</button>`).join("")}</div></div>`).join("")}</div>
     <div class="btn-row"><button class="btn" id="send" type="button">분석 완료</button></div>`,
   bind(g){ const pick={}; g.querySelectorAll(".seg").forEach(s=>s.querySelectorAll("button").forEach(b=>b.onclick=()=>{ pick[s.dataset.i]=+b.dataset.k; s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); sfx.key(); }));
     $("#send").onclick=()=>{ if(Object.keys(pick).length<dev.items.length){ msg("모든 문장을 분류하세요."); return; }
       if(dev.items.every((it,i)=>pick[i]===it[1])) solve(dev); else fail(dev,dev.items.map((it,i)=>(i+1)+dev.cats[pick[i]]).join(" ")); }; } };
 },
 tapmulti(dev){
  const toks=dev.text.split(" ");
  return { html:`<div class="tokens">${toks.map((t,i)=>`<button class="tok" type="button" data-i="${i}" aria-pressed="false">${esc(t.replace(/^\*/,""))}</button>`).join("")}</div>
    <div class="btn-row"><button class="btn" id="send" type="button">수정 사항 전송</button><span class="small" id="cnt">0개 표시</span></div>`,
   bind(g){ const bs=[...g.querySelectorAll(".tok")];
     bs.forEach(b=>b.onclick=()=>{ b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true"); sfx.key(); $("#cnt").textContent=bs.filter(x=>x.getAttribute("aria-pressed")==="true").length+"개 표시"; });
     $("#send").onclick=()=>{ const sel=bs.filter(x=>x.getAttribute("aria-pressed")==="true").map(x=>+x.dataset.i);
       const target=toks.map((t,i)=>t.startsWith("*")?i:-1).filter(i=>i>=0);
       if(!sel.length){ msg("틀린 단어를 눌러 표시하세요."); return; }
       if(sel.length===target.length&&target.every(i=>sel.includes(i))) solve(dev); else fail(dev,sel.map(i=>toks[i].replace(/^\*/,"")).join(", ")); }; } };
 }
};

/* ---------- door ---------- */
function openDoor(r){
  if(S.over) return;
  if(S.doorOpen[r.id]){ goCleared(r); return; }
  let entry="";
  const sym=r.door.map(c=>{ const dev=r.devices.find(d=>d.color===c); return shapeSVG(c,30,!!S.solved[dev.id]); }).join('<span class="small">→</span>');
  openModal(shell("출입문 키패드","DOOR CONTROL",null,`
    <p class="prompt">방 안 장치의 램프에 켜진 숫자를 이 모양 순서대로 입력하세요. 틀리면 산소 −${DOOR_COST}%</p>
    <div class="keypad-wrap"><div style="display:grid;gap:14px"><div class="order-sym">${sym}</div><div class="slots" id="slots">${"<div class='slot'></div>".repeat(3)}</div></div>
    <div class="keys" id="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-n="${n}">${n}</button>`).join("")}<button type="button" data-n="del" aria-label="지우기">⌫</button><button type="button" data-n="0">0</button><button type="button" class="go" data-n="go" aria-label="열기">OPEN</button></div></div>`,false));
  const show=()=>[...$("#slots").children].forEach((s,i)=>s.textContent=entry[i]||"");
  const press=n=>{ if(S.over) return;
    if(n==="del") entry=entry.slice(0,-1);
    else if(n==="go"){ if(entry.length<3){ msg("세 자리를 모두 입력하세요."); return; }
      const code=r.door.map(c=>r.devices.find(d=>d.color===c).digit).join("");
      if(entry===code){ sfx.door(); closeModal(); roomView(); S.running=false; S.doorOpen[r.id]=1; requestAnimationFrame(()=>requestAnimationFrame(()=>{ const g=view.querySelector('g[data-act="door"]'); if(g){ g.classList.add("open"); const pg=g.querySelector(".ping"); if(pg) pg.remove(); } })); setTimeout(()=>goCleared(r),1500); return; }
      sfx.bad(); shakeDev(); msg(`잠금 해제 실패 · 산소 −${DOOR_COST}%`); entry=""; if(drain(DOOR_COST)) return; }
    else if(entry.length<3){ entry+=n; sfx.key(); }
    show(); };
  $("#keys").onclick=e=>{ const b=e.target.closest("button"); if(b) press(b.dataset.n); };
  document.onkeydown=e=>{ if(e.key==="Escape") closeModal(); else if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==="Backspace") press("del"); else if(e.key==="Enter") press("go"); };
}
function goCleared(r){
  if(S.over) return; S.running=false;
  if(r.refill&&!S.refilled){ S.refilled=1; S.o2=Math.min(100,S.o2+r.refill); updateHud(); }
  sfx.unlock(); document.body.classList.remove("critical");
  view.innerHTML=`<div class="console"><div class="c-head"><span><b>${r.en}</b> · ${r.name}</span><span style="color:var(--ok)">DOOR OPEN</span></div>
   <div class="c-body"><div class="eyebrow">Sector Cleared</div><h2>${r.name} 통과</h2><p class="story">${esc(r.cleared)}</p>
   <div class="btn-row"><button class="btn" id="nx" type="button">다음 구역으로</button></div></div></div>`;
  $("#nx").onclick=()=>{ S.room++; briefing(); }; $("#nx").focus();
}
function tryHatch(){
  if(!S.solved.a1){ sfx.bad(); openModal(shell("탈출 포드 해치","POD HATCH",null,`<p class="prompt">해치가 잠겨 있다. ARIA 메인 콘솔의 손상된 메시지를 먼저 복구해야 한다.</p>`,false)); return; }
  escapeEnd();
}

/* ---------- endings ---------- */
function reviewHtml(){
  if(!S.mistakes.length) return `<div class="aria"><b>ARIA</b>모든 장치를 한 번에 해결했어요. 완벽한 탈출이에요!</div>`;
  return `<div style="display:grid;gap:10px"><div class="eyebrow">오답 노트 · ${S.mistakes.length}개 장치</div><div class="review">${S.mistakes.map(x=>`
   <div class="rv"><span class="m">${esc(x.room)} · ${esc(x.title)}</span><span>처음 낸 답: ${esc(x.given)}</span><span class="a">정답: ${esc(x.answer)}</span><span class="small">${strip(x.explain)}</span></div>`).join("")}</div></div>`;
}
function escapeEnd(){
  closeModal(); S.running=false; S.escaped=true; S.over=true; renderTrack(); document.body.classList.remove("critical"); sfx.unlock(); setTimeout(sfx.unlock,450);
  const acc=Math.round(S.firstTry/TOTAL_DEV*100), o2=Math.max(0,Math.ceil(S.o2));
  const score=o2*.4+acc*.6-S.hints*2; const grade=score>=80?"S":score>=65?"A":score>=50?"B":"C";
  const s=Math.floor(S.elapsed);
  view.innerHTML=`<div class="console"><div class="c-head"><span><b>ESCAPE POD</b> · LAUNCHED</span><span style="color:var(--ok)">RESCUE CONFIRMED</span></div><div class="c-body">
   <svg class="pod launch" viewBox="0 0 80 120" aria-hidden="true"><path d="M40 4 C60 24 64 52 62 84 L18 84 C16 52 20 24 40 4Z" fill="#e8ecf6"/><circle cx="40" cy="44" r="10" fill="#6fd6ff"/><path d="M18 70 L6 92 L18 88Z M62 70 L74 92 L62 88Z" fill="#ffb547"/><path d="M26 86 L40 118 L54 86Z" fill="#ffb547" opacity=".85"/></svg>
   <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="grade unlock">${grade}</div><div style="display:grid;gap:6px;min-width:0;flex:1 1 240px"><div class="eyebrow">Mission Complete</div><h2>ORBIT-7 탈출 성공!</h2><p class="story">탈출 포드가 정거장을 떠났다. 창밖으로 푸른 지구가 가까워진다.</p></div></div>
   <div class="stats"><div class="stat"><div class="v">${Math.floor(s/60)}분 ${s%60}초</div><div class="l">걸린 시간</div></div><div class="stat"><div class="v" style="color:var(--o2)">${o2}%</div><div class="l">남은 산소</div></div>
   <div class="stat"><div class="v">${S.firstTry}/${TOTAL_DEV}</div><div class="l">한 번에 해결한 장치</div></div><div class="stat"><div class="v">${S.hints}</div><div class="l">힌트 사용</div></div></div>
   ${reviewHtml()}<div class="btn-row"><button class="btn" id="again" type="button">다시 도전</button></div></div></div>`;
  $("#again").onclick=titleScreen;
}
function gameOver(){
  if(S.over) return; S.over=true; S.running=false; S.o2=0; updateHud(); closeModal(); document.body.classList.remove("critical"); sfx.bad();
  const r=ROOMS[S.room];
  view.innerHTML=`<div class="console"><div class="c-head"><span><b style="color:var(--alert)">O₂ DEPLETED</b></span><span>SIGNAL LOST</span></div><div class="c-body">
   <div class="eyebrow" style="color:var(--alert)">Mission Failed</div><h2>산소가 모두 떨어졌다</h2>
   <p class="story">시야가 흐려진다… ${r.name}에서 의식을 잃었다.
정신을 차려 보니 다시 수면 캡슐 안이다.</p>
   <p class="small">통과한 구역 ${S.room} / 4 · 해결한 장치 ${Object.keys(S.solved).length} / ${TOTAL_DEV}</p>
   ${reviewHtml()}<div class="btn-row"><button class="btn" id="again" type="button">처음부터 다시</button></div></div></div>`;
  $("#again").onclick=titleScreen;
}

/* ---------- starfield ---------- */
(function(){ const c=$("#stars"),x=c.getContext("2d"); let W,H,st=[]; const red=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; st=Array.from({length:Math.round(innerWidth*innerHeight/3500)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.9+.1})); }
  size(); addEventListener("resize",size);
  (function f(){ x.fillStyle="#080b13"; x.fillRect(0,0,W,H); const g=x.createRadialGradient(W*.82,H*1.05,0,W*.82,H*1.05,H*.7); g.addColorStop(0,"rgba(70,120,220,.2)"); g.addColorStop(1,"rgba(8,11,19,0)"); x.fillStyle=g; x.fillRect(0,0,W,H);
    for(const s of st){ if(!red){ s.x-=s.z*.25*devicePixelRatio; if(s.x<0){s.x=W;s.y=Math.random()*H;} } x.fillStyle=`rgba(220,230,255,${.25+s.z*.6})`; x.fillRect(s.x,s.y,s.z*1.8*devicePixelRatio,s.z*1.8*devicePixelRatio); }
    if(!red) requestAnimationFrame(f); })();
})();

titleScreen();
</script>
